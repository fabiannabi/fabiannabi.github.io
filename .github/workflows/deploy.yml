name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which never runs on pull requests, gets the
# Pages and OIDC permissions it needs.
permissions:
  contents: read

# A superseded deploy is wasted work, but never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false # the job never pushes; don't leave a token in .git/config

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # This site argues that its author does accessibility well, so a contrast
      # failure is a contradiction, not a warning. It breaks the build.
      - name: Contrast audit
        run: pnpm audit:contrast

      - name: Unit and accessibility tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer builds and previews the real thing, so this
      # covers the build as well as the behaviour.
      - name: End-to-end tests
        run: pnpm exec playwright test --project=chromium --project=reduced-motion

      # Order matters: vite build empties dist, so Storybook has to be written
      # into it afterwards or it gets wiped by the next build.
      - name: Build site
        run: pnpm exec vite build

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the site to GitHub Pages
      id-token: write # Pages verifies the deployment with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
