name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploying to Pages needs id-token; nothing here needs write access to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# A superseded deploy is wasted work, but never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # This site argues that its author does accessibility well, so a contrast
      # failure is a contradiction, not a warning. It breaks the build.
      - name: Contrast audit
        run: pnpm audit:contrast

      - name: Unit and accessibility tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer builds and previews the real thing, so this
      # covers the build as well as the behaviour.
      - name: End-to-end tests
        run: pnpm exec playwright test --project=chromium --project=reduced-motion

      # Order matters: vite build empties dist, so Storybook has to be written
      # into it afterwards or it gets wiped by the next build.
      - name: Build site
        run: pnpm exec vite build

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
