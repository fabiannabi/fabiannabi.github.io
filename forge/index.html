<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forge — agent teams that turn tickets into reviewed pull requests</title>
    <meta
      name="description"
      content="Case study: Forge, a platform where agent teams turn tickets into reviewed pull requests — in sealed containers, under a budget, with a human merging every one. Real costs and results from the frontscan repo it built."
    />
    <meta property="og:title" content="Forge — agent teams that turn tickets into reviewed pull requests" />
    <meta
      property="og:description"
      content="How Forge plans, builds and reviews code with agents safely, and what it built: 18 merged pull requests at about a dollar each, and a CLI on npm."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fabiannabi.github.io/forge/" />
    <link rel="canonical" href="https://fabiannabi.github.io/forge/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Before first paint. Deciding the theme in React costs a frame of the
         wrong palette on every load, and the flash is the bug. Stored under its
         own key so /design/ can be read in light while the profile stays dark. */
      (() => {
        try {
          const saved = localStorage.getItem("ds-theme");
          const system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.dsTheme =
            saved === "light" || saved === "dark" ? saved : system;
        } catch {
          document.documentElement.dataset.dsTheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/forge.tsx"></script>
  </body>
</html>
