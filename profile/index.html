    <script>
      /* Set the theme before first paint. Doing this in React means a frame of
         the wrong theme on every load — the flash is the bug, not the toggle. */
      (() => {
        try {
          const saved = localStorage.getItem("theme");
          const system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
