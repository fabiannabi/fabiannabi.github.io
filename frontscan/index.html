<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>frontscan — how your team really uses its design system</title>
    <meta
      name="description"
      content="frontscan, an open-source command-line tool that reports colours written by hand instead of design tokens, and which components and props a frontend team really uses. Real runs on Cal.com and Excalidraw."
    />
    <meta property="og:title" content="frontscan — how your team really uses its design system" />
    <meta
      property="og:description"
      content="One command, a few seconds: raw colours with the nearest token, component and prop usage. Built entirely by agents in Forge."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fabiannabi.github.io/frontscan/" />
    <link rel="canonical" href="https://fabiannabi.github.io/frontscan/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Before first paint. Deciding the theme in React costs a frame of the
         wrong palette on every load, and the flash is the bug. Stored under its
         own key so /design/ can be read in light while the profile stays dark. */
      (() => {
        try {
          const saved = localStorage.getItem("ds-theme");
          const system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.dsTheme =
            saved === "light" || saved === "dark" ? saved : system;
        } catch {
          document.documentElement.dataset.dsTheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/frontscan.tsx"></script>
  </body>
</html>
